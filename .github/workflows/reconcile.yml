name: Reconcile Okta to Greenhouse

on:
  schedule:
    # Daily at 02:00 UTC (07:30 IST). Catches anyone the event-based sync missed.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (don't actually create users)"
        required: false
        default: "false"

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile
        env:
          OKTA_DOMAIN: ${{ secrets.OKTA_DOMAIN }}
          OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
          GREENHOUSE_API_KEY: ${{ secrets.GREENHOUSE_API_KEY }}
          GREENHOUSE_ON_BEHALF_OF: ${{ secrets.GREENHOUSE_ON_BEHALF_OF }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python reconcile.py
