name: Lookup Greenhouse User

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email to look up"
        required: true
        default: "sheetal.mohan@devrev.ai"

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lookup user
        env:
          GREENHOUSE_CLIENT_ID: ${{ secrets.GREENHOUSE_CLIENT_ID }}
          GREENHOUSE_CLIENT_SECRET: ${{ secrets.GREENHOUSE_CLIENT_SECRET }}
          GREENHOUSE_SUB_USER_ID: ${{ secrets.GREENHOUSE_SUB_USER_ID }}
          LOOKUP_EMAIL: ${{ inputs.email }}
        run: python lookup_user.py
